[project]
name = "manifest-doctor"
version = "0.1.0"
description = "Read-only manifest verifier that groups findings into probable causes."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Georgi Stoyanov" }]
dependencies = []  # standard library only, by design

[project.optional-dependencies]
dev = ["pytest"]  # used only to run the tests

[project.scripts]
manifest-doctor = "manifest_doctor.cli:main"

[tool.pytest.ini_options]
# Lets the tests import manifest_doctor straight from this folder,
# without installing the package first.
pythonpath = ["."]
testpaths = ["tests"]
